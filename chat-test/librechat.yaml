# Configuração da LibreChat para testar SOMENTE o agente Ruthenia.
# Nenhum provedor é exposto direto na UI — tudo passa pelo shim `agent-api`,
# que por sua vez roda o grafo LangGraph.
#
# Docs: https://www.librechat.ai/docs/quick_start/custom_endpoints

version: 1.3.15
cache: true

endpoints:
  custom:
    - name: "Ruthenia Agent"
      apiKey: "${AGENT_API_KEY}"
      baseURL: "http://agent-api:8787/v1"
      models:
        # IDs no formato "provider/model" — o shim faz o split no primeiro "/".
        # Qualquer string é aceita; edite à vontade.
        default:
          - "anthropic/claude-sonnet-5"
          - "anthropic/claude-opus-5"
          - "anthropic/claude-haiku-4-5"
          - "openai/gpt-4o-mini"
          - "openai/gpt-4o"
          - "google-genai/gemini-3.5-flash-lite"
          - "google-genai/gemini-3.5-flash"
          - "google-genai/gemini-3.1-flash-lite"
          - "google-genai/gemini-2.5-pro"
          - "google-genai/gemini-2.5-flash"
          - "google-genai/gemini-2.5-flash-lite"
          - "google-genai/gemini-live-2.5-flash-native-audio"
          - "deepseek/deepseek-chat"
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Ruthenia Agent"
